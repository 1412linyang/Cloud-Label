<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分类待办事项（分类管理模块）</title>
    <style>
        /* 仅保留分类管理必需基础样式，其余UI样式归属于ui-style分支 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        
        /* 内置分类标签栏样式 */
        .category-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0; }
        .category-tab { 
            padding: 10px 16px; background: #e0e0e0; border: none; border-radius: 20px; 
            cursor: pointer; font-size: 14px; 
        }
        .category-tab.active, .category-tab:hover { background: #3498db; color: white; }
        
        /* 自定义分类区域样式 */
        .custom-category-section { margin: 20px 0; padding: 15px; background: #f8f9fa; border-radius: 8px; }
        .custom-category-section h3 { margin-bottom: 15px; color: #2c3e50; }
        .custom-category-form { display: flex; gap: 10px; margin-bottom: 15px; }
        .custom-category-form input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        .custom-category-form button { 
            background: #9b59b6; color: white; border: none; padding: 10px 15px; 
            border-radius: 4px; cursor: pointer; 
        }
        .custom-categories { display: flex; flex-wrap: wrap; gap: 8px; }
        .custom-category-tag { 
            background: #9b59b6; color: white; padding: 6px 12px; border-radius: 15px; 
            font-size: 12px; cursor: pointer; position: relative; padding-right: 24px; 
        }
        .delete-category-btn { 
            position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
            border: none; background: transparent; color: white; cursor: pointer; opacity: 0.6;
        }
        .custom-category-tag:hover .delete-category-btn { opacity: 1; }
        
        /* 任务列表（仅用于展示筛选效果，核心任务逻辑归属于task-core分支） */
        .task-list { list-style: none; }
        .task-item { padding: 15px; margin: 10px 0; background: #f8f9fa; border-radius: 8px; }
        .task-category { background: #3498db; color: white; padding: 4px 10px; border-radius: 15px; font-size: 12px; }
        .empty-state { text-align: center; padding: 40px; color: #999; }
        
        /* 任务添加输入框（仅用于分类联动，核心添加逻辑归属于task-core分支） */
        .add-task-section { display: flex; gap: 10px; margin: 20px 0; }
        .add-task-section input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 6px; }
        .add-task-section select { padding: 12px; border: 1px solid #ddd; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>分类待办事项（分类管理模块）</h1>

        <!-- 任务添加区（仅用于分类联动，核心添加逻辑归属于task-core分支） -->
        <div class="add-task-section">
            <input type="text" id="taskInput" placeholder="输入新的待办事项...">
            <select id="categorySelect">
                <option value="工作">工作</option>
                <option value="学习">学习</option>
                <option value="生活">生活</option>
                <option value="购物">购物</option>
                <option value="其他">其他</option>
            </select>
        </div>

        <!-- 1. 内置分类筛选标签 -->
        <div class="category-tabs">
            <button class="category-tab active" onclick="filterTasks('全部', this)">全部</button>
            <button class="category-tab" onclick="filterTasks('工作', this)">工作</button>
            <button class="category-tab" onclick="filterTasks('学习', this)">学习</button>
            <button class="category-tab" onclick="filterTasks('生活', this)">生活</button>
            <button class="category-tab" onclick="filterTasks('购物', this)">购物</button>
            <button class="category-tab" onclick="filterTasks('其他', this)">其他</button>
        </div>

        <!-- 2. 自定义分类区域 -->
        <div class="custom-category-section">
            <h3>自定义分类标签</h3>
            <div class="custom-category-form">
                <input type="text" id="newCategoryInput" placeholder="输入新分类标签名称">
                <button onclick="addCustomCategory()">添加分类</button>
            </div>
            <div class="custom-categories" id="customCategoriesContainer">
                <!-- 自定义分类标签动态渲染区 -->
            </div>
        </div>

        <!-- 任务列表（仅用于展示分类筛选效果，核心任务逻辑归属于task-core分支） -->
        <ul class="task-list" id="taskList">
            <div class="empty-state">暂无任务</div>
        </ul>
    </div>
